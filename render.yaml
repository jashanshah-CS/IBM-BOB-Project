services:
  - type: web
    name: testforge-api
    runtime: node
    plan: free
    rootDir: TestForge
    buildCommand: npm ci && npm run build && python3 -m pip install --user "pytest>=8,<10"
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_EXE
        value: python3
